name: ci
on: { push: { branches: [main], tags: ['v*'] }, pull_request: {}, workflow_dispatch: {}, schedule: [{ cron: '0 6 * * 1' }] }   # Mondays 06:00 UTC: a quiet-day run so a broken runner, mirror or dependency shows up before a release needs it (Q30)
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt && python -m py_compile audit.py tests/*.py
      - run: pip install -q pyflakes && python -m pyflakes audit.py tests/*.py
      - name: "ffmpeg + mkvtoolnix without Ubuntu mirrors (static ffmpeg from GitHub, mkvtoolnix from the Debian image)"
        timeout-minutes: 10
        run: sudo bash scripts/ci-media-tools.sh
      - run: python tests/synthetic_media.py
      - run: python tests/plain_language.py && python tests/contract.py && python tests/regressions.py && python tests/row_owners.py && python tests/authz.py && python tests/remux.py && python tests/watch_priority.py && python tests/errors_log.py && python tests/subsync.py && python tests/shapes_check.py && python tests/settings_types.py && python tests/lang_rule.py && python tests/sandbox_mode.py && python tests/fix_during_run.py && python tests/hardsub.py && python tests/golden_digest.py && python tests/perf_budget.py
      - run: python tests/fuzz_detectors.py 3000 7 && python tests/fuzz_detectors.py 1500 ${{ github.run_number }}
      - run: python tests/mutation_check.py anchors && python tests/mutation_check.py   # every mutant's line exists (every run) + one rotating mutant per day; 'all' locally
      - uses: actions/setup-node@v7
        with: { node-version: "24" }
      - run: cd uibot && npm install --silent && node ui_bot.js ../ui.html fixtures
      - run: cd uibot && node fuzz_ui.js ../ui.html fixtures 250 ${{ github.run_number }}   # Q34: mangled API answers must not break the page; a new seed every run
      - run: cd uibot && python3 lint_checks.py && python3 lint_buttons.py && python3 edge_fixtures.py && for c in empty tidy huge down errors arrgap signin deeplink mp4mkv busy; do node ui_bot.js ../ui.html fixtures-edge/$c || exit 1; done
      - run: cd uibot && npx playwright install chromium-headless-shell >/dev/null && node browser_bot.js ../ui.html fixtures
      - run: sudo mkdir -p /data && sudo chown $USER /data && python tests/e2e_stack.py
      - run: python tests/e2e_chaos.py
      - run: docker build -q -t auditarr:ci . && docker build -q -t auditarr-uibot:ci uibot
      - uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: "auditarr:ci", severity: "CRITICAL,HIGH", ignore-unfixed: true, exit-code: "1", format: "table" }
      - run: cd uibot && node visual_diff.js
      - name: tell the owner when the quiet-day run breaks (set the NTFY_URL secret; NTFY_TOKEN optional)
        if: failure() && github.event_name == 'schedule'
        env: { NTFY_URL: "${{ secrets.NTFY_URL }}", NTFY_TOKEN: "${{ secrets.NTFY_TOKEN }}" }
        run: |
          [ -n "$NTFY_URL" ] || { echo "no NTFY_URL secret - skipping the push"; exit 0; }
          curl -s -o /dev/null -H "Title: Auditarr CI broke on its own" -H "Priority: high" -H "Tags: warning" ${NTFY_TOKEN:+-H "Authorization: Bearer $NTFY_TOKEN"} -d "The weekly scheduled CI run failed with no code change: a runner, mirror or dependency problem. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" "$NTFY_URL" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: ui-screenshots, path: uibot/screens/*.png, if-no-files-found: ignore }
  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: ver
        run: echo "v=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-3.0
      - uses: docker/build-push-action@v7
        with: { context: ., push: true, provenance: false, sbom: false, tags: "${{ steps.meta.outputs.tags }}", labels: "${{ steps.meta.outputs.labels }}", build-args: "VERSION=${{ steps.ver.outputs.v }}\nREVISION=${{ github.sha }}" }
      - uses: docker/build-push-action@v7
        with: { context: ./uibot, push: true, provenance: false, sbom: false, tags: "ghcr.io/${{ github.repository }}-uibot:latest", build-args: "REVISION=${{ github.sha }}" }
