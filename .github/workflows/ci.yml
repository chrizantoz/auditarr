name: ci
on: { push: { branches: [main], tags: ['v*'] }, pull_request: {}, workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt && python -m py_compile audit.py tests/*.py
      - run: pip install -q pyflakes && python -m pyflakes audit.py tests/*.py
      - run: sudo apt-get install -y -qq ffmpeg mkvtoolnix >/dev/null && python tests/synthetic_media.py
      - run: python tests/plain_language.py && python tests/contract.py && python tests/regressions.py && python tests/authz.py && python tests/golden_digest.py && python tests/perf_budget.py
      - run: python tests/fuzz_detectors.py 3000 7 && python tests/fuzz_detectors.py 1500 ${{ github.run_number }}
      - run: python tests/mutation_check.py   # one rotating mutant per day; 'all' locally
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: cd uibot && npm install --silent && node ui_bot.js ../ui.html fixtures
      - run: cd uibot && python3 edge_fixtures.py && for c in empty huge down errors; do node ui_bot.js ../ui.html fixtures-edge/$c || exit 1; done
      - run: cd uibot && npx playwright install --with-deps chromium-headless-shell >/dev/null && node browser_bot.js ../ui.html fixtures
      - run: sudo mkdir -p /data && sudo chown $USER /data && python tests/e2e_stack.py
      - run: python tests/e2e_chaos.py
      - run: docker build -q -t auditarr:ci . && docker build -q -t auditarr-uibot:ci uibot
      - uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: "auditarr:ci", severity: "CRITICAL,HIGH", ignore-unfixed: true, exit-code: "1", format: "table" }
      - run: cd uibot && node visual_diff.js
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: ui-screenshots, path: uibot/screens/*.png, if-no-files-found: ignore }
  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-3.0
      - uses: docker/build-push-action@v7
        with: { context: ., push: true, provenance: false, sbom: false, tags: "${{ steps.meta.outputs.tags }}", labels: "${{ steps.meta.outputs.labels }}" }
      - uses: docker/build-push-action@v7
        with: { context: ./uibot, push: true, provenance: false, sbom: false, tags: "ghcr.io/${{ github.repository }}-uibot:latest" }
