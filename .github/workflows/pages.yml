name: demo-site
on: { push: { branches: [main] }, workflow_dispatch: {} }
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: python uibot/make_demo.py site/index.html && cp docs/how-it-works.html site/how-it-works.html
      - uses: actions/upload-pages-artifact@v5
        with: { path: site }
  deploy:
    needs: build
    if: github.event.repository.private == false   # GitHub Pages needs a public repository on the free plan; the artifact above is built either way
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
