<svg xmlns="http://www.w3.org/2000/svg" style="font-family:Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#162021" viewBox="0 0 1400 880" role="img" aria-label="Auditarr reads the library from Sonarr, Radarr, Bazarr, Plex and the files, then lists, probes, checks, fixes what is safe and reports to the page and your phone."><rect width="100%" height="100%" rx="12" fill="#162021"/>
      <defs>
        <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e4ecea"/></marker>
        <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3dd6b4"/></marker>
      </defs>
      <g font-size="16" fill="#e4ecea" stroke="#e4ecea">
        <text x="40" y="70" font-size="20" font-weight="600" stroke="none">What it reads</text>
        <g fill="#162021" stroke-width="1.6">
          <rect x="40" y="100" width="360" height="100" rx="12"/><rect x="40" y="220" width="360" height="100" rx="12"/><rect x="40" y="340" width="360" height="100" rx="12"/><rect x="40" y="460" width="360" height="100" rx="12"/><rect x="40" y="580" width="360" height="100" rx="12"/>
        </g>
        <g stroke="none">
          <text x="64" y="140" font-size="20" font-weight="600">Sonarr · Radarr</text><text x="64" y="172" fill="#93a5a1">which files exist, what language they should be</text>
          <text x="64" y="260" font-size="20" font-weight="600">Bazarr</text><text x="64" y="292" fill="#93a5a1">which files still want subtitles</text>
          <text x="64" y="380" font-size="20" font-weight="600">Plex</text><text x="64" y="412" fill="#93a5a1">what is indexed, what is up next, which player</text>
          <text x="64" y="500" font-size="20" font-weight="600">Tautulli <tspan font-size="15" font-weight="400" fill="#93a5a1">optional</tspan></text><text x="64" y="532" fill="#93a5a1">who watched what, and when</text>
          <text x="64" y="620" font-size="20" font-weight="600">The media files</text><text x="64" y="652" fill="#93a5a1">ffprobe: streams, languages, length, header</text>
        </g>
        <g stroke-width="1.6"><line x1="400" y1="150" x2="498" y2="330" marker-end="url(#a1)"/><line x1="400" y1="270" x2="498" y2="370" marker-end="url(#a1)"/><line x1="400" y1="390" x2="498" y2="410" marker-end="url(#a1)"/><line x1="400" y1="510" x2="498" y2="450" marker-end="url(#a1)"/><line x1="400" y1="630" x2="498" y2="490" marker-end="url(#a1)"/></g>
        <rect x="500" y="60" width="440" height="740" rx="18" fill="#153832" stroke="#3dd6b4" stroke-width="2.2"/>
        <text x="720" y="108" text-anchor="middle" font-size="26" font-weight="600" fill="#3dd6b4" stroke="none">Auditarr</text>
        <text x="720" y="136" text-anchor="middle" fill="#93a5a1" stroke="none" font-size="15">one container · runs at 05:00 · about 25 min per 10,000 files</text>
        <g fill="#162021" stroke="#3dd6b4" stroke-width="1.4">
          <rect x="528" y="166" width="384" height="98" rx="12"/><rect x="528" y="290" width="384" height="98" rx="12"/><rect x="528" y="414" width="384" height="98" rx="12"/><rect x="528" y="538" width="384" height="98" rx="12"/><rect x="528" y="662" width="384" height="98" rx="12"/>
        </g>
        <g stroke="#3dd6b4" stroke-width="1.6"><line x1="720" y1="264" x2="720" y2="288" marker-end="url(#a2)"/><line x1="720" y1="388" x2="720" y2="412" marker-end="url(#a2)"/><line x1="720" y1="512" x2="720" y2="536" marker-end="url(#a2)"/><line x1="720" y1="636" x2="720" y2="660" marker-end="url(#a2)"/></g>
        <g stroke="none" text-anchor="middle">
          <text x="720" y="206" font-size="20" font-weight="600">1 · List</text><text x="720" y="236" fill="#93a5a1">every file the arrs know, plus strays on disk</text>
          <text x="720" y="330" font-size="20" font-weight="600">2 · Probe</text><text x="720" y="360" fill="#93a5a1">only new or changed files, cached by size and date</text>
          <text x="720" y="454" font-size="20" font-weight="600">3 · Check</text><text x="720" y="484" fill="#93a5a1">about 30 checks, each finding gets a plain sentence</text>
          <text x="720" y="578" font-size="20" font-weight="600">4 · Fix what is safe</text><text x="720" y="608" fill="#93a5a1">only the switches you turned On, all reversible</text>
          <text x="720" y="702" font-size="20" font-weight="600">5 · Report</text><text x="720" y="732" fill="#93a5a1">page, morning push, self-test, state backup</text>
        </g>
        <text x="1020" y="70" font-size="20" font-weight="600" stroke="none">What you get</text>
        <g fill="#162021" stroke-width="1.6"><rect x="1020" y="100" width="340" height="110" rx="12"/><rect x="1020" y="250" width="340" height="110" rx="12"/><rect x="1020" y="400" width="340" height="110" rx="12"/><rect x="1020" y="550" width="340" height="110" rx="12"/></g>
        <g stroke="none">
          <text x="1044" y="142" font-size="20" font-weight="600">The page</text><text x="1044" y="174" fill="#93a5a1">Today · Findings · Trash · History</text>
          <text x="1044" y="292" font-size="20" font-weight="600">One morning push</text><text x="1044" y="324" fill="#93a5a1">"3 need you · 41 fixes overnight"</text>
          <text x="1044" y="442" font-size="20" font-weight="600">Commands to the arrs</text><text x="1044" y="474" fill="#93a5a1">rescan, search, re-download, tag</text>
          <text x="1044" y="592" font-size="20" font-weight="600">Subtitles via Bazarr</text><text x="1044" y="624" fill="#93a5a1">searches, and AI (Whisper) when none exist</text>
        </g>
        <g stroke-width="1.6"><line x1="940" y1="700" x2="1018" y2="170" marker-end="url(#a1)"/><line x1="940" y1="710" x2="1018" y2="310" marker-end="url(#a1)"/><line x1="940" y1="590" x2="1018" y2="455" marker-end="url(#a1)"/><line x1="940" y1="600" x2="1018" y2="600" marker-end="url(#a1)"/></g>
        <text x="700" y="852" text-anchor="middle" fill="#93a5a1" stroke="none" font-size="16">A new download does not wait for the night: Sonarr and Radarr call Auditarr the moment a file lands, and it is checked within a minute.</text>
      </g>
    </svg>