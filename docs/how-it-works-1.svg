<svg xmlns="http://www.w3.org/2000/svg" style="font-family:Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#ffffff" viewBox="0 0 940 430" role="img" aria-label="Auditarr reads the library from Sonarr, Radarr and Bazarr, probes the real files, runs its checks, stores findings, fixes the safe ones, and reports to the page and the phone."><rect width="100%" height="100%" rx="12" fill="#ffffff"/>
      <defs>
        <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17201f"/></marker>
        <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f8a74"/></marker>
      </defs>
      <g font-size="13" fill="#17201f" stroke="#17201f">
        <!-- sources -->
        <text x="20" y="30" font-weight="600" stroke="none">What it reads</text>
        <g fill="#ffffff" stroke-width="1.5">
          <rect x="20" y="44" width="160" height="40" rx="9"/><rect x="20" y="94" width="160" height="40" rx="9"/><rect x="20" y="144" width="160" height="40" rx="9"/><rect x="20" y="194" width="160" height="40" rx="9"/><rect x="20" y="244" width="160" height="40" rx="9"/>
        </g>
        <g stroke="none">
          <text x="100" y="69" text-anchor="middle">Sonarr · Radarr</text>
          <text x="100" y="119" text-anchor="middle">Bazarr</text>
          <text x="100" y="169" text-anchor="middle">Plex</text>
          <text x="100" y="219" text-anchor="middle">Tautulli <tspan fill="#5f6f6c">(optional)</tspan></text>
          <text x="100" y="269" text-anchor="middle">the media files</text>
        </g>
        <g fill="#5f6f6c" stroke="none" font-size="11.5" text-anchor="end">
          <text x="300" y="58">which files exist, what language they should be</text>
          <text x="300" y="108">which files still want subtitles</text>
          <text x="300" y="158">what is indexed, what is up next, which player</text>
          <text x="300" y="208">who watched what, and when</text>
          <text x="300" y="258">ffprobe: streams, languages, length, header</text>
        </g>
        <g stroke-width="1.5">
          <line x1="180" y1="64" x2="330" y2="110" marker-end="url(#a1)"/><line x1="180" y1="114" x2="330" y2="125" marker-end="url(#a1)"/><line x1="180" y1="164" x2="330" y2="140" marker-end="url(#a1)"/><line x1="180" y1="214" x2="330" y2="155" marker-end="url(#a1)"/><line x1="180" y1="264" x2="330" y2="170" marker-end="url(#a1)"/>
        </g>
        <!-- auditarr pipeline -->
        <rect x="332" y="44" width="300" height="340" rx="14" fill="#dff3ee" stroke="#0f8a74" stroke-width="2"/>
        <text x="482" y="72" text-anchor="middle" font-size="16" font-weight="600" fill="#0f8a74" stroke="none">Auditarr</text>
        <text x="482" y="90" text-anchor="middle" fill="#5f6f6c" stroke="none" font-size="12">one container · runs at 05:00 · about 25 min per 10,000 files</text>
        <g fill="#ffffff" stroke="#0f8a74" stroke-width="1.2">
          <rect x="352" y="104" width="260" height="40" rx="8"/><rect x="352" y="160" width="260" height="40" rx="8"/><rect x="352" y="216" width="260" height="40" rx="8"/><rect x="352" y="272" width="260" height="40" rx="8"/><rect x="352" y="328" width="260" height="40" rx="8"/>
        </g>
        <g stroke="#0f8a74" stroke-width="1.2"><line x1="482" y1="144" x2="482" y2="158" marker-end="url(#a2)"/><line x1="482" y1="200" x2="482" y2="214" marker-end="url(#a2)"/><line x1="482" y1="256" x2="482" y2="270" marker-end="url(#a2)"/><line x1="482" y1="312" x2="482" y2="326" marker-end="url(#a2)"/></g>
        <g stroke="none">
          <text x="482" y="121" text-anchor="middle" font-weight="600">1 · list</text><text x="482" y="136" text-anchor="middle" fill="#5f6f6c" font-size="11.5">every file the arrs know, plus strays on disk</text>
          <text x="482" y="177" text-anchor="middle" font-weight="600">2 · probe</text><text x="482" y="192" text-anchor="middle" fill="#5f6f6c" font-size="11.5">only new or changed files, cached by size and date</text>
          <text x="482" y="233" text-anchor="middle" font-weight="600">3 · check</text><text x="482" y="248" text-anchor="middle" fill="#5f6f6c" font-size="11.5">about 30 checks → findings with a plain sentence each</text>
          <text x="482" y="289" text-anchor="middle" font-weight="600">4 · fix what is safe</text><text x="482" y="304" text-anchor="middle" fill="#5f6f6c" font-size="11.5">only the switches you turned On; everything reversible</text>
          <text x="482" y="345" text-anchor="middle" font-weight="600">5 · report</text><text x="482" y="360" text-anchor="middle" fill="#5f6f6c" font-size="11.5">page, morning push, self-test, state backup</text>
        </g>
        <!-- outputs -->
        <text x="700" y="30" font-weight="600" stroke="none">What you get</text>
        <g fill="#ffffff" stroke-width="1.5">
          <rect x="700" y="44" width="220" height="60" rx="9"/><rect x="700" y="124" width="220" height="60" rx="9"/><rect x="700" y="204" width="220" height="60" rx="9"/><rect x="700" y="284" width="220" height="60" rx="9"/>
        </g>
        <g stroke="none">
          <text x="810" y="68" text-anchor="middle" font-weight="600">The page</text><text x="810" y="88" text-anchor="middle" fill="#5f6f6c" font-size="11.5">Today · Findings · Trash · History</text>
          <text x="810" y="148" text-anchor="middle" font-weight="600">One morning push</text><text x="810" y="168" text-anchor="middle" fill="#5f6f6c" font-size="11.5">"3 need you · 41 fixes overnight"</text>
          <text x="810" y="228" text-anchor="middle" font-weight="600">Commands to the arrs</text><text x="810" y="248" text-anchor="middle" fill="#5f6f6c" font-size="11.5">rescan, search, re-download, tag</text>
          <text x="810" y="308" text-anchor="middle" font-weight="600">Subtitles via Bazarr</text><text x="810" y="328" text-anchor="middle" fill="#5f6f6c" font-size="11.5">searches, and AI (Whisper) when none exist</text>
        </g>
        <g stroke-width="1.5"><line x1="632" y1="348" x2="698" y2="74" marker-end="url(#a1)"/><line x1="632" y1="348" x2="698" y2="154" marker-end="url(#a1)"/><line x1="632" y1="292" x2="698" y2="234" marker-end="url(#a1)"/><line x1="632" y1="292" x2="698" y2="314" marker-end="url(#a1)"/></g>
        <text x="470" y="412" text-anchor="middle" fill="#5f6f6c" stroke="none" font-size="12">a new download does not wait for the night: Sonarr and Radarr call Auditarr the moment a file lands, and it is checked within a minute</text>
      </g>
    </svg>