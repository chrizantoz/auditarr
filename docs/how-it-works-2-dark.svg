<svg xmlns="http://www.w3.org/2000/svg" style="font-family:Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#162021" viewBox="0 0 1400 560" role="img" aria-label="A file moved by Auditarr goes to a trash folder with a countdown; from there it can be put back with one click or, for re-downloads, replaced by the arr; only after the countdown is it purged."><rect width="100%" height="100%" rx="12" fill="#162021"/>
      <g font-size="16" fill="#e4ecea" stroke="#e4ecea">
        <rect x="40" y="150" width="340" height="140" rx="14" fill="#162021" stroke-width="1.6"/>
        <text x="210" y="205" text-anchor="middle" font-size="20" font-weight="600" stroke="none">A file in your library</text>
        <text x="210" y="238" text-anchor="middle" fill="#93a5a1" stroke="none">duplicate · bad copy · lying header</text>
        <line x1="380" y1="220" x2="518" y2="220" stroke-width="1.6" marker-end="url(#a1)"/>
        <text x="449" y="196" text-anchor="middle" fill="#93a5a1" stroke="none" font-size="15">Move to trash · Re-download</text>
        <text x="449" y="250" text-anchor="middle" fill="#93a5a1" stroke="none" font-size="15">Fix header · Fix sync</text>
        <rect x="520" y="90" width="380" height="260" rx="16" fill="#153832" stroke="#3dd6b4" stroke-width="2.2"/>
        <text x="710" y="136" text-anchor="middle" font-size="22" font-weight="600" fill="#3dd6b4" stroke="none">.media-audit-trash</text>
        <text x="710" y="166" text-anchor="middle" fill="#93a5a1" stroke="none">on the same disk · no copy · instant</text>
        <g fill="#162021" stroke="#3dd6b4" stroke-width="1.4"><rect x="548" y="196" width="324" height="52" rx="10"/><rect x="548" y="264" width="324" height="52" rx="10"/></g>
        <text x="710" y="229" text-anchor="middle" stroke="none">duplicates 3 days · re-downloads 14 days</text>
        <text x="710" y="297" text-anchor="middle" stroke="none">archives 30 days · countdown on the Trash tab</text>
        <path d="M520 320 C420 420, 300 420, 210 292" fill="none" stroke="#3dd6b4" stroke-width="1.8" marker-end="url(#a2)"/>
        <text x="330" y="438" text-anchor="middle" fill="#3dd6b4" stroke="none" font-size="16" font-weight="600">Undo · one click, any time before the countdown ends</text>
        <line x1="900" y1="150" x2="1038" y2="150" stroke-width="1.6" marker-end="url(#a1)"/>
        <text x="969" y="128" text-anchor="middle" fill="#93a5a1" stroke="none" font-size="15">countdown over</text>
        <rect x="1040" y="110" width="320" height="80" rx="12" fill="#162021" stroke-width="1.6"/>
        <text x="1200" y="158" text-anchor="middle" font-size="19" stroke="none">purged for good</text>
        <line x1="900" y1="290" x2="1038" y2="290" stroke-width="1.6" marker-end="url(#a1)"/>
        <text x="969" y="268" text-anchor="middle" fill="#93a5a1" stroke="none" font-size="15">re-download tracked</text>
        <rect x="1040" y="240" width="320" height="100" rx="12" fill="#173d1c" stroke="#8fd694" stroke-width="1.8"/>
        <text x="1200" y="280" text-anchor="middle" stroke="none" fill="#8fd694" font-size="19" font-weight="600">a better copy arrives</text>
        <text x="1200" y="312" text-anchor="middle" stroke="none" fill="#93a5a1" font-size="15">or the original comes back by itself</text>
        <text x="700" y="520" text-anchor="middle" fill="#93a5a1" stroke="none" font-size="16">A re-download that comes back with the same defect twice is treated as "that is how the show is", not as a broken file.</text>
      </g>
    </svg>