<svg xmlns="http://www.w3.org/2000/svg" style="font-family:Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#ffffff" viewBox="0 0 1400 400" role="img" aria-label="Each automatic action sits behind a three-position switch, Off, Only report, On, and the page shows tonight's plan before the night runs it."><rect width="100%" height="100%" rx="12" fill="#ffffff"/>
      <g font-size="16" fill="#17201f" stroke="#17201f">
        <g fill="#ffffff" stroke-width="1.6"><rect x="40" y="50" width="260" height="100" rx="14"/><rect x="330" y="50" width="260" height="100" rx="14"/><rect x="620" y="50" width="260" height="100" rx="14"/></g>
        <rect x="620" y="50" width="260" height="100" rx="14" fill="none" stroke="#0f8a74" stroke-width="2.4"/>
        <g stroke="none" text-anchor="middle">
          <text x="170" y="94" font-size="22" font-weight="600">Off</text><text x="170" y="126" fill="#5f6f6c">never acts</text>
          <text x="460" y="94" font-size="22" font-weight="600">Only report</text><text x="460" y="126" fill="#5f6f6c">writes down what it would do</text>
          <text x="750" y="94" font-size="22" font-weight="600" fill="#0f8a74">On</text><text x="750" y="126" fill="#5f6f6c">acts, reversibly</text>
        </g>
        <text x="920" y="80" stroke="none" font-size="18" font-weight="600">One switch per job</text>
        <text x="920" y="110" stroke="none" fill="#5f6f6c">duplicates · re-downloads · AI subtitles</text>
        <text x="920" y="138" stroke="none" fill="#5f6f6c">accept a language · fix headers · content checks</text>
        <rect x="40" y="200" width="1320" height="150" rx="14" fill="#dff3ee" stroke="#0f8a74" stroke-width="1.8"/>
        <text x="64" y="244" stroke="none" font-size="20" font-weight="600" fill="#0f8a74">Tonight's plan</text>
        <text x="64" y="282" stroke="none" fill="#5f6f6c">The Today panel lists exactly what the next run will do on its own, from the current findings, before it does it:</text>
        <text x="64" y="316" stroke="none" font-size="18">"download a better copy of 3 · make AI subtitles for 10 · fix the time bar of 2"</text>
      </g>
    </svg>